name: Automated Social Metric Scraper & View Auditor

on:
  # 1. Scheduled cron: Runs every 1 hour 24/7 to check for due post audits
  schedule:
    - cron: '0 * * * *'

  # 2. Manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of submissions to audit'
        required: false
        default: '50'

  # 3. Webhook trigger from App Server Action on submission
  repository_dispatch:
    types: [trigger-scraper, new-submission]

concurrency:
  group: scraper-audit-runner
  cancel-in-progress: false

jobs:
  audit-submissions:
    name: Scrape & Audit Submissions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.scraper/requirements.txt'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .scraper/requirements.txt

      - name: Install Node Dependencies & Playwright
        run: |
          npm install apify-client playwright-core @supabase/supabase-js
          npx playwright install chromium --with-deps

      - name: Run Metric Scraper & View Auditor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_API_TOKENS: ${{ secrets.APIFY_API_TOKENS }}
          APIFY_INSTAGRAM_ACTOR: 'nH2AHrwxeTRJoN5hX'
          SCRAPER_BATCH_SIZE: ${{ github.event.inputs.batch_size || '50' }}
        run: |
          python .scraper/runner.py

      - name: Process Daily Settlement Batches & Auto-Release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node .scraper/settle.js


