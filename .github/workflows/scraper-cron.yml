name: Automated Social Metric Scraper & View Auditor

on:
  # 1. Scheduled cron: Runs every 1 hour 24/7 to check for due post audits
  schedule:
    - cron: '0 * * * *'

  # 2. Manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of submissions to audit'
        required: false
        default: '50'
      force:
        description: 'Force audit bypassing 60-minute cooldown (true/false)'
        required: false
        default: 'false'
      submission_id:
        description: 'Specific submission UUID to audit immediately'
        required: false
        default: ''

  # 3. Webhook trigger from App Server Action on submission
  repository_dispatch:
    types: [trigger-scraper, new-submission]

concurrency:
  group: scraper-audit-runner
  cancel-in-progress: false

jobs:
  audit-submissions:
    name: Scrape & Audit Submissions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.scraper/requirements.txt'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .scraper/requirements.txt

      - name: Install Node Dependencies & Playwright
        run: |
          npm install apify-client playwright-core @supabase/supabase-js
          npx playwright install chromium --with-deps

      - name: Run Metric Scraper & View Auditor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_API_TOKENS: ${{ secrets.APIFY_API_TOKENS }}
          APIFY_INSTAGRAM_ACTOR: 'nH2AHrwxeTRJoN5hX'
          SCRAPER_BATCH_SIZE: ${{ github.event.inputs.batch_size || github.event.client_payload.batch_size || '50' }}
          FORCE_AUDIT: ${{ github.event.inputs.force || github.event.client_payload.force || 'false' }}
          SUBMISSION_ID: ${{ github.event.inputs.submission_id || github.event.client_payload.submission_id || '' }}
        run: |
          ARGS=""
          if [ "$FORCE_AUDIT" = "true" ] || [ "$FORCE_AUDIT" = "True" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "$SUBMISSION_ID" ]; then
            ARGS="$ARGS --id $SUBMISSION_ID"
          fi
          python .scraper/runner.py $ARGS

      - name: Process Daily Settlement Batches & Auto-Release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node .scraper/settle.js


