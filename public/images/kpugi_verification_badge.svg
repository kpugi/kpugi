<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0F1420"/>
      <stop offset="100%" stop-color="#080B11"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="250" r="300" fill="#2563EB" opacity="0.18" filter="url(#glow)"/>
  <circle cx="880" cy="800" r="350" fill="#10B981" opacity="0.14" filter="url(#glow)"/>

  <!-- Central Card Frame -->
  <rect x="140" y="140" width="800" height="800" rx="48" fill="#121722" stroke="#232C3E" stroke-width="3"/>
  <rect x="140" y="140" width="800" height="800" rx="48" fill="url(#cardGlow)"/>

  <!-- Inner Border Accent -->
  <rect x="164" y="164" width="752" height="752" rx="36" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- KPUGI Wordmark -->
  <g transform="translate(540, 260)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="8" fill="#3B82F6">KPUGI</text>
    <text y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" letter-spacing="4" fill="#94A3B8">PERFORMANCE CREATOR MARKETPLACE</text>
  </g>

  <!-- Verification Shield Icon -->
  <g transform="translate(540, 480)">
    <circle cx="0" cy="0" r="96" fill="#047857" opacity="0.25"/>
    <circle cx="0" cy="0" r="80" fill="url(#badgeGradient)"/>
    <!-- Checkmark inside Shield -->
    <path d="M-28 -4 L-8 18 L32 -24" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Headline -->
  <g transform="translate(540, 660)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="52" fill="url(#textGradient)">OFFICIAL CREATOR</text>
    <text y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="32" fill="#10B981" letter-spacing="3">CHANNEL VERIFIED</text>
  </g>

  <!-- Footer Info Tag -->
  <g transform="translate(540, 810)">
    <rect x="-240" y="-24" width="480" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text y="7" text-anchor="middle" font-family="monospace" font-weight="700" font-size="16" letter-spacing="2" fill="#E2E8F0">POST VERIFICATION BADGE • KPUGI.COM</text>
  </g>
</svg>
